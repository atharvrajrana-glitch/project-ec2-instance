services:

  db:
    image: mysql:latest

    container_name: database_my

    restart: always #unless-stopped #restart the container automatically if it crashes or the server reboots 
        
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fastapi_db
    ports:
      - "3307:3306"
    volumes:
        - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .

    container_name: fastapi-web

    ports:
        - "8000:8000"
    depends_on:
      db:
        condition: service_healthy     
        
      
volumes:
  mysql_data:

        
        
        





    




  